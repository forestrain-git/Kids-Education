name: Deploy to Tencent CloudBase

on:
  push:
    branches: [gh-pages]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CloudBase CLI
        run: |
          npm install -g @cloudbase/cli
          cloudbase --version

      - name: Deploy to CloudBase Hosting
        env:
          SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          # 创建临时部署目录，只包含需要的文件
          mkdir -p _deploy
          cp index.html parent.html app.js data.js extra_questions.js _deploy/

          # 登录并部署
          cloudbase login --apiKeyId "$SECRET_ID" --apiKey "$SECRET_KEY"
          cloudbase hosting deploy _deploy / -e kids-education-d8gak4uog7d6f09fa --yes
