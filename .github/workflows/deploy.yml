name: Deploy to Tencent CloudBase

on:
  push:
    branches: [gh-pages]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Login and Deploy
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          echo "Logging in to CloudBase..."
          tcb login --apiKeyId "$TENCENT_SECRET_ID" --apiKey "$TENCENT_SECRET_KEY" --non-interactive 2>&1 || true
          echo "Checking login status..."
          tcb env:list 2>&1 || true
          echo "Deploying..."
          tcb hosting deploy . -e kids-education-d8gak4uog7d6f09fa --yes 2>&1 || true
