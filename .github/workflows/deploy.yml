name: Deploy to Tencent CloudBase

on:
  push:
    branches: [gh-pages]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug env
        run: |
          echo "Node version:"
          node --version
          echo "NPM version:"
          npm --version
          echo "Secrets set check:"
          if [ -n "${{ secrets.TENCENT_SECRET_ID }}" ]; then echo "SECRET_ID is set"; else echo "SECRET_ID is NOT set"; fi
          if [ -n "${{ secrets.TENCENT_SECRET_KEY }}" ]; then echo "SECRET_KEY is set"; else echo "SECRET_KEY is NOT set"; fi

      - name: Install CloudBase CLI
        run: |
          echo "Installing @cloudbase/cli..."
          npm install -g @cloudbase/cli
          echo "Installed. Version:"
          tcb --version || cloudbase --version

      - name: Login to CloudBase
        run: |
          echo "Attempting login..."
          tcb login --apiKeyId "${{ secrets.TENCENT_SECRET_ID }}" --apiKey "${{ secrets.TENCENT_SECRET_KEY }}" 2>&1 || echo "Login exit code: $?"

      - name: Deploy to CloudBase Hosting
        run: |
          echo "Attempting deploy..."
          tcb hosting deploy . -e kids-education-d8gak4uog7d6f09fa 2>&1 || echo "Deploy exit code: $?"
