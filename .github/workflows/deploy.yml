name: Deploy to Tencent CloudBase

on:
  push:
    branches: [gh-pages]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to CloudBase Hosting
        run: |
          npx @cloudbase/cli login --apiKeyId "$SECRET_ID" --apiKey "$SECRET_KEY"
          npx @cloudbase/cli hosting deploy . / -e kids-education-d8gak4uog7d6f09fa --delete
        env:
          SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
