name: Deploy to Tencent CloudBase

on:
  push:
    branches: [gh-pages]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CloudBase CLI
        run: |
          npm install -g @cloudbase/cli
          cloudbase --version

      - name: Deploy Cloud Functions
        env:
          SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          set -e
          echo "Logging into CloudBase..."
          cloudbase login --apiKeyId "$SECRET_ID" --apiKey "$SECRET_KEY"

          echo "Creating cloud function 'api' if not exists..."
          cloudbase fn create api --runTime Nodejs18 --memorySize 128 --timeout 5 --yes || echo "Create step done (may already exist)"

          echo "Deploying cloud function 'api'..."
          cloudbase fn deploy api --yes --force
          echo "Cloud function deployed."

          echo "Listing functions to verify..."
          cloudbase fn list || true

      - name: Deploy to CloudBase Hosting
        env:
          SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          set -e
          rm -rf _deploy
          mkdir -p _deploy
          cp index.html parent.html app.js data.js extra_questions.js cloud-sync.js _deploy/

          echo "Files in _deploy:"
          ls -la _deploy/

          echo "Logging into CloudBase..."
          cloudbase login --apiKeyId "$SECRET_ID" --apiKey "$SECRET_KEY"
          echo "Deploying to hosting..."
          cloudbase hosting deploy _deploy /kids-education -e kids-education-d8gak4uog7d6f09fa --yes
          echo "Hosting deployed."
